openapi: 3.1.0
info:
  title: anki-week Anki Actions
  description: >
    OPTIONAL live-mode Actions for the anki-week Custom GPT. These operations mirror the tools the
    Anki MCP Server add-on (AnkiWeb code 124672614) exposes on the desktop app at
    http://127.0.0.1:3141.

    IMPORTANT — transport reality: ChatGPT Actions call an HTTPS server from OpenAI's cloud and CANNOT
    reach localhost. The add-on natively speaks MCP (JSON-RPC), not REST. To use these Actions you must
    expose your Anki behind a public HTTPS endpoint that implements the REST shape below (a small
    reverse-proxy / shim in front of the add-on, or the add-on's optional wss://tunnel.ankimcp.ai
    fronted by an HTTPS-to-MCP bridge). If you have not set that up, DELETE this Action and run the GPT
    in advisory mode — it will hand you copy-pasteable Anki queries and commands instead.

    Set `servers[0].url` below to your own HTTPS endpoint. Add authentication in the ChatGPT Action UI
    (API key header recommended). This schema is a logical reference for the operations the skill uses;
    adapt field names to your shim if they differ.
  version: 1.0.0
servers:
  - url: https://your-anki-endpoint.example.com
    description: Your HTTPS endpoint that proxies to the local Anki MCP Server. Replace this URL.
paths:
  /list_decks:
    post:
      operationId: listDecks
      summary: List all decks in the collection.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Array of deck names (and ids, if provided by the shim).
          content:
            application/json:
              schema:
                type: object
  /sync:
    post:
      operationId: sync
      summary: Sync the collection with AnkiWeb. Call at the start and end of a build.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                type: object
  /find_notes:
    post:
      operationId: findNotes
      summary: Search notes with standard Anki search syntax. Returns note ids and a total count.
      description: >
        Use the standard Anki query language. Quote the whole query; use :: for tag hierarchy and a
        trailing * for descendants, e.g. tag:#AK_Step1_v12::^Systems::Cardio::HeartSounds*. Add
        is:suspended to count only the cards a build would actually change. Even with limit:1 the
        response includes total, so you can size a subtree cheaply before pulling ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Anki search string, e.g. "tag:#AK_Step1_v12::#B&B::18_Pathology::01_General::06_Inflammation_Principles* is:suspended".
                limit:
                  type: integer
                  description: Max note ids to return. total is reported regardless.
                  default: 100
      responses:
        "200":
          description: Matching note ids and the total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note_ids:
                    type: array
                    items:
                      type: integer
                  total:
                    type: integer
  /notes_info:
    post:
      operationId: notesInfo
      summary: Get details for note ids, including each note's card ids. Resolve notes -> cards here.
      description: >
        find_notes returns note ids; suspend/unsuspend need card ids. Pass the note ids here and read
        each note's cards[] to get the card ids. Caps around 100 notes per batch. Pass
        include_fields to also return field text for a coverage audit (e.g. ["Text"]).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note_ids]
              properties:
                note_ids:
                  type: array
                  items:
                    type: integer
                include_fields:
                  type: array
                  items:
                    type: string
                  description: Field names to include; pass [] to omit field text and keep the response small.
      responses:
        "200":
          description: Per-note info including cards[].
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        note_id:
                          type: integer
                        cards:
                          type: array
                          items:
                            type: integer
                        tags:
                          type: array
                          items:
                            type: string
                        fields:
                          type: object
  /card_management:
    post:
      operationId: cardManagement
      summary: Suspend or unsuspend cards by card id.
      description: >
        Unsuspend is idempotent — only currently-suspended cards change. Undo a build by suspending the
        same card ids. Uses CARD ids (resolve from notes via notes_info.cards[]).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, card_ids]
              properties:
                action:
                  type: string
                  enum: [suspend, unsuspend]
                card_ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Result of the suspend/unsuspend.
          content:
            application/json:
              schema:
                type: object
  /tag_management:
    post:
      operationId: tagManagement
      summary: Add, remove, or replace tags on notes by note id.
      description: >
        Uses NOTE ids. Add the per-lecture Sched tag on a build, remove it to undo. replace_tags renames
        a tag in place. Tag scheme: Sched::<Class>::M<n>-W<nn>::IM##-<Topic>, plus Sched::custom on
        hand-authored cards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note_ids]
              properties:
                action:
                  type: string
                  enum: [add_tags, remove_tags, replace_tags]
                note_ids:
                  type: array
                  items:
                    type: integer
                tags:
                  type: string
                  description: Space-separated tags for add_tags / remove_tags.
                old_tag:
                  type: string
                  description: For replace_tags.
                new_tag:
                  type: string
                  description: For replace_tags.
      responses:
        "200":
          description: Result of the tag operation.
          content:
            application/json:
              schema:
                type: object
  /add_note:
    post:
      operationId: addNote
      summary: Add a custom Basic or Cloze note (for lecture concepts AnKing lacks).
      description: >
        Author into the AnKing Step Deck, in the professor's exact wording, then tag with the lecture's
        Sched::…IM##-<Topic> tag plus Sched::custom. NOTE — this collection's Cloze model requires a
        "Back Extra" field; pass it (even as "") or the add fails with "Missing required fields".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_name, model, fields]
              properties:
                deck_name:
                  type: string
                  default: AnKing Step Deck
                model:
                  type: string
                  enum: [Basic, Cloze]
                fields:
                  type: object
                  description: 'Field name -> value. Cloze needs {Text, "Back Extra"}; Basic needs {Front, Back}.'
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The created note id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note_id:
                    type: integer
  /filtered_deck:
    post:
      operationId: filteredDeck
      summary: Create/update or delete a filtered (study) deck for a lecture.
      description: >
        Build one filtered deck per lecture from its Sched:: tag, reschedule ON. GOTCHAS — a card can't
        be in two filtered decks; create_or_update on an existing name makes a +-suffixed duplicate
        instead of updating. To replace a deck, DELETE the old one first (cards return home, FSRS
        intact), then create fresh. Must unsuspend the cards first or it gathers nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, name]
              properties:
                action:
                  type: string
                  enum: [create_or_update, delete]
                name:
                  type: string
                  description: e.g. "IM20 · Acute Inflammation" (append " 🚧" while unreconciled against slides).
                search_terms:
                  type: array
                  description: List of search-term objects for create_or_update.
                  items:
                    type: object
                    properties:
                      search:
                        type: string
                        example: tag:Sched::IM::M1-W01::IM20-*
                      limit:
                        type: integer
                        default: 200
                      order:
                        type: string
                        default: added
                reschedule:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Result including the deck id.
          content:
            application/json:
              schema:
                type: object
  /get_tags:
    post:
      operationId: getTags
      summary: Enumerate tags, optionally filtered by prefix (to list a subtree's child leaves).
      description: >
        Prefer this (or the Anki browser tag tree) over sampling sequential note ids, which cluster by
        topic and mislead. Use it to enumerate a system's child leaves before choosing altitude.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prefix:
                  type: string
                  description: e.g. "#AK_Step1_v12::^Systems::Cardio::"
      responses:
        "200":
          description: Array of tag strings.
          content:
            application/json:
              schema:
                type: object
